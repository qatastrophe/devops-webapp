services:
  backend:
    build: ./backend
    container_name: webapp-backend
    networks:
      - webapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "${BACKEND_HEALTH_ENDPOINT:-http://backend:8080/health}"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: webapp-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - webapp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "${NGINX_HEALTH_ENDPOINT:-http://nginx/nginx-health}"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  webapp-network:
    driver: bridge
    name: webapp-network

services:
  backend:
    build: ./backend
    container_name: webapp-backend
    networks:
      - webapp-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: webapp-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - webapp-network
    restart: unless-stopped

networks:
  webapp-network:
    driver: bridge
    name: webapp-network
